# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-github-plugin"
version = "1.6.0"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The GitHub-OAuth login module as a droppable busbar plugin — a cdylib exporting the auth kind's door (login-capable, auth ABI v3). Drop it in the plugins folder and add `github` to auth.chain with a browser_login block; the plugin holds its client secret and runs the token exchange over its own need."
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]   # cdylib: the dropped-in image exporting the door; rlib: the tests link it

[dependencies]
# busbar-auth-github is a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the real
# logic lives here, not in busbar). The one busbar crate is busbar-contract (#40), whose
# `abi::sdk` carries the export macro — pinned by git rev to `.busbar-ref` field 1.
busbar-contract = { workspace = true }
busbar-auth-github = { path = "../auth-github" }

[dev-dependencies]
# Dev-only: the linked + dropped-in conformance test (tests/conformance.rs) signs, packs, scans and
# opens the built cdylib over the REAL loader, and the live plugin-side e2e (tests/e2e.rs) locates it
# with the loader's filename helper. Same pinned rev as busbar-contract, so one busbar source resolves.
# `conformance`: busbar's PUBLISHED conformance suite (`tests/conformance.rs`'s
# `conformance_suite!`), run against the busbar commit this repo pins.
busbar-plugin-loader = { workspace = true }
busbar-test-kit = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "blocking"] }
serde_json = { workspace = true }
# THE SUITE'S HOST (tests/support/conformance_host.rs, the test kit's framed form): busbar's
# connector and its TLS test kit, and the transport doors this plugin's `http` need names. Dev-only.
busbar-core-connector = { workspace = true }
busbar-transport-http = { workspace = true }
busbar-transport-tcp = { workspace = true }

[lints]
workspace = true
