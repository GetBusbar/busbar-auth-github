# RENDERED by `busbar-release plugin sync busbar-auth-github` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@98766e540f27e42d770e2fbac72e11144a366f1e
    with:
      plugin_crate: busbar-auth-github-plugin
      manifest_name: busbar-auth-github
      plugin_alias: github
      plugin_kind: auth
      asset_prefix: busbar-auth-github
      description: "The GitHub-OAuth login module as a droppable busbar plugin: a cdylib exporting the auth C ABI (login-capable). Drop it in the plugins folder and add github to auth.chain with a browser_login block (the core injects client_secret)."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "busbar-auth-github/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@98766e540f27e42d770e2fbac72e11144a366f1e
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-auth-github
      plugin_name: busbar-auth-github
      plugin_alias: github
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
