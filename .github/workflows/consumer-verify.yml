# RENDERED by `busbar-release plugin sync busbar-auth-github` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "45 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@6afe9099862269f055ef05ec90611b5ef38b0fae
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-auth-github
      plugin_name: busbar-auth-github
      plugin_alias: github
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
